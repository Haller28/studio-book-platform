<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start your salon — Studio Book</title>
<meta name="description" content="Create your Studio Book account and get your own salon booking site and staff portal in minutes.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <nav class="nav">
    <a href="index.html" class="brand">Studio <span>Book</span></a>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline" style="padding:11px 20px">Log In</a>
    </div>
  </nav>
</header>

<div class="signup-wrap">
  <h2 style="text-align:center;margin-bottom:8px">Start your salon</h2>
  <p style="text-align:center;color:var(--ink-soft);margin-bottom:36px">Free for 30 days. No credit card charged until your trial ends.</p>

  <div class="signup-card">
    <div class="plan-pick" id="planPick">
      <button type="button" data-plan="studio" class="pp-btn">
        <div class="pp-name">Studio</div>
        <div class="pp-price">$19/mo</div>
      </button>
      <button type="button" data-plan="pro" class="pp-btn active">
        <div class="pp-name">Studio Pro</div>
        <div class="pp-price">$39/mo</div>
      </button>
    </div>

    <form id="signupForm">
      <div class="field">
        <label for="salonName">Salon name</label>
        <input type="text" id="salonName" placeholder="e.g. The Hair Loft" required>
      </div>
      <div class="field">
        <label for="ownerName">Your name</label>
        <input type="text" id="ownerName" placeholder="Owner / manager name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@yoursalon.com" required>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="(555) 555-5555">
      </div>
      <div class="field">
        <label for="oldSiteUrl">Existing website (optional)</label>
        <input type="url" id="oldSiteUrl" placeholder="https://your-old-site.com">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px" id="submitBtn">Continue to checkout</button>
      <p style="font-size:.78rem;color:var(--ink-soft);text-align:center;margin-top:16px">By continuing you agree to Studio Book's <a href="terms.html" style="text-decoration:underline">Terms of Service</a> and <a href="privacy.html" style="text-decoration:underline">Privacy Policy</a>. Cancel anytime, no long-term contract.</p>
    </form>
    <div id="formMsg" style="display:none;margin-top:16px;padding:14px;border-radius:8px;background:var(--cream2);font-size:.88rem;text-align:center"></div>
  </div>
</div>

<footer>
  <p>© <span id="year"></span> Studio Book.</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

let selectedPlan = 'pro';
const params = new URLSearchParams(window.location.search);
if (params.get('plan') === 'studio') selectedPlan = 'studio';

function syncPlanButtons(){
  document.querySelectorAll('.pp-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.plan === selectedPlan);
  });
}
syncPlanButtons();

document.querySelectorAll('.pp-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    selectedPlan = btn.dataset.plan;
    syncPlanButtons();
  });
});

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Setting things up...';

  const payload = {
    plan: selectedPlan,
    salonName: document.getElementById('salonName').value.trim(),
    ownerName: document.getElementById('ownerName').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    oldSiteUrl: document.getElementById('oldSiteUrl').value.trim()
  };

  try {
    const res = await fetch('/.netlify/functions/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.checkoutUrl) {
      window.location.href = data.checkoutUrl;
      return;
    }

    if (data.pending) {
      msg.style.display = 'block';
      msg.textContent = data.message || "Thanks! We've got your details — billing isn't live quite yet, so our team will reach out personally to get your salon set up.";
      submitBtn.textContent = 'Request received';
      return;
    }

    throw new Error(data.error || 'Something went wrong');
  } catch (err) {
    msg.style.display = 'block';
    msg.style.background = '#fbe8e8';
    msg.textContent = "We couldn't process that — please try again in a moment.";
    submitBtn.disabled = false;
    submitBtn.textContent = 'Continue to checkout';
  }
});
</script>

</body>
</html>
